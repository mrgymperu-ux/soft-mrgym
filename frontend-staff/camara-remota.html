<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Estación facial - Mr Gym</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#080b0a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
        video{width:100vw;height:100dvh;object-fit:cover;transform:scaleX(-1) scale(1.25)}
        #guia{display:none;position:fixed;z-index:2;left:50%;top:50%;width:min(81.6vw,50.4vh,432px);aspect-ratio:.72;transform:translate(-50%,-50%);box-shadow:0 0 0 999px rgba(0,0,0,.27);pointer-events:none;border-radius:48% 48% 44% 44%/42% 42% 58% 58%}
        #guia svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
        #guia svg line{stroke:#7a8079;stroke-width:5;stroke-linecap:round;transition:stroke .25s ease,filter .25s ease}
        #guia svg line.lleno{stroke:#23c875;filter:drop-shadow(0 0 4px rgba(35,200,117,.95))}
        #guia.completo{box-shadow:0 0 0 999px rgba(0,0,0,.2),0 0 28px rgba(35,200,117,.85)}
        #banner-captura{display:none;position:fixed;z-index:5;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:#e8b400;color:#241c00;font-weight:800;letter-spacing:.04em;font-size:1rem;box-shadow:0 4px 18px rgba(0,0,0,.4)}
        #nombre-captura{display:none;position:fixed;z-index:5;left:50%;top:calc(max(18px,env(safe-area-inset-top)) + 48px);transform:translateX(-50%);padding:5px 16px;border-radius:999px;background:rgba(0,0,0,.55);font-size:.85rem;backdrop-filter:blur(6px)}
        #estado{position:fixed;z-index:4;left:16px;right:16px;bottom:max(20px,env(safe-area-inset-bottom));padding:14px;border-radius:12px;background:rgba(0,0,0,.7);text-align:center;font-weight:700;backdrop-filter:blur(8px)}
        #porcentaje{display:block;margin-top:4px;color:#7cf0ae;font-size:.82rem}
        #resultado{display:none;position:fixed;z-index:8;inset:0;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.6rem,8vw,3rem);font-weight:800;padding:30px}
        #resultado.ok{background:rgba(13,155,86,.92)}
        #resultado.aviso{background:rgba(179,58,20,.92)}
        #iniciar{position:fixed;inset:0;margin:auto;width:min(86vw,360px);height:58px;border:0;border-radius:14px;background:#23c875;color:#062d1b;font-size:1.05rem;font-weight:800}
        #conexion{position:fixed;z-index:4;left:16px;top:max(16px,env(safe-area-inset-top));padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.5);font-size:.72rem;font-weight:700}
        #conexion.activa{color:#7cf0ae}
        #conexion.caida{color:#ffb3a0}
    </style>
</head>
<body>
<video id="video" playsinline muted></video>
<div id="conexion">Conectando…</div>
<div id="banner-captura">CAPTURA FACIAL</div>
<div id="nombre-captura"></div>
<div id="guia" aria-hidden="true"><svg viewBox="0 0 320 420"></svg></div>
<button id="iniciar">Activar cámara frontal</button>
<div id="estado" aria-live="polite"><span id="mensaje">Pulsa para conectar esta cámara al counter</span><span id="porcentaje"></span></div>
<div id="resultado" aria-live="assertive"></div>
<script src="vendor/human/human.js"></script>
<script>
(function () {
"use strict";

const token = new URLSearchParams(location.search).get("token");
const esLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
const API_BASE = esLocal ? "http://localhost:8000" : `${location.origin}/api`;
const WS_BASE = (esLocal ? "ws" : "wss") + "://" + (esLocal ? "localhost:8000" : `${location.host}/api`);

const MODELO_VERSION = "human-3.3.6-faceres";
const UMBRAL_COINCIDENCIA = 0.55;
const CAPTURAS_REGISTRO = 3;
const UMBRAL_ROSTRO = 0.55;
const ANCHO_ROSTRO_MINIMO = 85;
const INTERVALO_MS = 240;
const NUM_TICKS = 60;

const CONFIG = {
    backend: "webgl",
    modelBasePath: "vendor/human/models/",
    cacheSensitivity: 0.01,
    filter: { enabled: false },
    face: {
        enabled: true,
        detector: { rotation: false, maxDetected: 1, minConfidence: 0.45 },
        mesh: { enabled: false },
        iris: { enabled: false },
        description: { enabled: true },
        antispoof: { enabled: false },
        liveness: { enabled: false },
        emotion: { enabled: false },
    },
    body: { enabled: false },
    hand: { enabled: false },
    object: { enabled: false },
    gesture: { enabled: false },
};

const video = document.getElementById("video");
const estadoNodo = document.getElementById("estado");
const mensaje = document.getElementById("mensaje");
const porcentaje = document.getElementById("porcentaje");
const boton = document.getElementById("iniciar");
const resultado = document.getElementById("resultado");
const guia = document.getElementById("guia");
const svgGuia = guia.querySelector("svg");
const bannerCaptura = document.getElementById("banner-captura");
const nombreCaptura = document.getElementById("nombre-captura");
const conexionNodo = document.getElementById("conexion");

let human = null, promesaMotor = null, stream = null, temporizador = null, ejecutando = false;
let ws = null;
let modo = "reconocer";
let objetivoClienteId = null, objetivoNombre = "";
let descriptores = [];
let capturas = [];
let ultimaCaptura = 0;
let ultimoCandidato = null, repeticionesCandidato = 0;
const ultimoIntentoPorCliente = new Map();

function crearTicks() {
    const cx = 160, cy = 210, rx = 151, ry = 200, largo = 22;
    for (let i = 0; i < NUM_TICKS; i++) {
        const angulo = (i / NUM_TICKS) * Math.PI * 2 - Math.PI / 2;
        const bx = cx + rx * Math.cos(angulo), by = cy + ry * Math.sin(angulo);
        const nx = Math.cos(angulo), ny = ry / rx * Math.sin(angulo);
        const mag = Math.hypot(nx, ny) || 1;
        const ix = bx - (nx / mag) * largo, iy = by - (ny / mag) * largo;
        const linea = document.createElementNS("http://www.w3.org/2000/svg", "line");
        linea.setAttribute("x1", bx.toFixed(1));
        linea.setAttribute("y1", by.toFixed(1));
        linea.setAttribute("x2", ix.toFixed(1));
        linea.setAttribute("y2", iy.toFixed(1));
        svgGuia.appendChild(linea);
    }
}
crearTicks();
const ticks = Array.from(svgGuia.querySelectorAll("line"));

function actualizarGuia(valorProgreso, texto, tipo = "") {
    const progreso = Math.max(0, Math.min(100, Number(valorProgreso) || 0));
    guia.style.display = "block";
    const llenos = Math.round((progreso / 100) * NUM_TICKS);
    ticks.forEach((linea, i) => linea.classList.toggle("lleno", i < llenos));
    guia.classList.toggle("completo", progreso === 100 && tipo !== "buscando");
    mensaje.textContent = texto || "Acomoda tu rostro dentro del óvalo";
    porcentaje.textContent = progreso > 0 ? `${Math.round(progreso)}%` : "";
}

function marcarConexion(activa) {
    conexionNodo.textContent = activa ? "Counter conectado" : "Esperando al counter…";
    conexionNodo.className = activa ? "activa" : "caida";
}

function enviar(dato) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(dato));
}

function mostrarResultado(texto, tipoAviso, duracionMs = 3000) {
    resultado.textContent = texto;
    resultado.className = tipoAviso;
    resultado.style.display = "flex";
    window.setTimeout(() => {
        resultado.style.display = "none";
        actualizarGuia(0, modo === "registrar" ? "Acomoda tu rostro dentro del óvalo" : "Listo para el siguiente alumno");
    }, duracionMs);
}

function volverAReconocer() {
    modo = "reconocer";
    objetivoClienteId = null;
    objetivoNombre = "";
    capturas = [];
    bannerCaptura.style.display = "none";
    nombreCaptura.style.display = "none";
    ultimoCandidato = null;
    repeticionesCandidato = 0;
    actualizarGuia(0, "Acomoda tu rostro dentro del óvalo");
}

function iniciarModoRegistro(clienteId, clienteNombre) {
    modo = "registrar";
    objetivoClienteId = clienteId;
    objetivoNombre = clienteNombre || "";
    capturas = [];
    ultimaCaptura = 0;
    bannerCaptura.style.display = "block";
    nombreCaptura.textContent = objetivoNombre;
    nombreCaptura.style.display = objetivoNombre ? "block" : "none";
    actualizarGuia(0, "Acomoda tu rostro dentro del óvalo");
}

function conectarSocket() {
    ws = new WebSocket(`${WS_BASE}/ws/camara-remota/${encodeURIComponent(token)}/movil`);
    ws.onopen = () => marcarConexion(true);
    ws.onclose = () => { marcarConexion(false); window.setTimeout(conectarSocket, 2000); };
    ws.onmessage = (evento) => {
        let m;
        try { m = JSON.parse(evento.data); } catch (_) { return; }
        if (m.tipo === "pc-conectado") marcarConexion(true);
        else if (m.tipo === "pc-desconectado") marcarConexion(false);
        else if (m.tipo === "iniciar_registro" && m.cliente_id) iniciarModoRegistro(m.cliente_id, m.cliente_nombre);
        else if (m.tipo === "cancelar_registro") volverAReconocer();
    };
}

async function cargarMotor() {
    if (human) return human;
    if (promesaMotor) return promesaMotor;
    promesaMotor = (async () => {
        const instancia = new window.Human.Human(CONFIG);
        await instancia.load();
        await instancia.warmup({ warmup: "face" });
        human = instancia;
        return human;
    })().catch((error) => { human = null; promesaMotor = null; throw error; });
    return promesaMotor;
}

async function cargarDescriptores() {
    const respuesta = await fetch(`${API_BASE}/dispositivo-facial/descriptores`, {
        headers: { "X-Camera-Token": token },
    });
    if (!respuesta.ok) throw new Error("No se pudieron cargar los rostros registrados");
    descriptores = await respuesta.json();
}

function validarRostro(deteccion) {
    const caras = deteccion.face || [];
    if (caras.length === 0) return { mensaje: "Coloca tu rostro dentro del óvalo" };
    const cara = caras[0];
    if (!cara.embedding || cara.embedding.length !== 1024) return { mensaje: "Acércate un poco a la cámara" };
    const confianza = Number(cara.faceScore || cara.score || cara.boxScore || 0);
    if (confianza < UMBRAL_ROSTRO || !cara.box || cara.box[2] < ANCHO_ROSTRO_MINIMO) return { mensaje: "Acércate y mantén el rostro al frente" };
    return { cara };
}

function similitud(a, b) {
    return human.match.similarity(a, b, { order: 2, multiplier: 25, min: 0.2, max: 0.8 });
}

function promedio(vectores) {
    const salida = new Array(1024).fill(0);
    vectores.forEach((vector) => vector.forEach((valor, i) => { salida[i] += valor; }));
    return salida.map((valor) => valor / vectores.length);
}

async function procesarReconocimiento(cara) {
    let mejor = null, segundo = null;
    for (const item of descriptores) {
        const s = similitud(cara.embedding, item.descriptor);
        if (!mejor || s > mejor.similitud) { segundo = mejor; mejor = { item, similitud: s }; }
        else if (!segundo || s > segundo.similitud) segundo = { item, similitud: s };
    }
    const margenSeguro = !mejor || !segundo || mejor.similitud - segundo.similitud >= 0.03;
    if (!mejor || mejor.similitud < UMBRAL_COINCIDENCIA || !margenSeguro) {
        ultimoCandidato = null;
        repeticionesCandidato = 0;
        actualizarGuia(0, "Rostro no reconocido. Intenta de nuevo.", "buscando");
        return;
    }
    if (ultimoCandidato === mejor.item.cliente_id) repeticionesCandidato += 1;
    else { ultimoCandidato = mejor.item.cliente_id; repeticionesCandidato = 1; }
    if (repeticionesCandidato < 2) {
        actualizarGuia(60, "Rostro alineado. Mantente quieto.", "alineado");
        return;
    }
    const clienteId = mejor.item.cliente_id, nombre = mejor.item.nombre_completo;
    if (Date.now() - (ultimoIntentoPorCliente.get(clienteId) || 0) < 15000) return;
    ultimoIntentoPorCliente.set(clienteId, Date.now());
    ultimoCandidato = null;
    repeticionesCandidato = 0;
    actualizarGuia(100, "Identidad confirmada", "completo");
    try {
        const respuesta = await fetch(`${API_BASE}/dispositivo-facial/asistencia`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Camera-Token": token },
            body: JSON.stringify({ cliente_id: clienteId }),
        });
        const datos = await respuesta.json().catch(() => ({}));
        if (!respuesta.ok) throw new Error(datos.detail || "No se pudo autorizar el ingreso");
        if (datos.ya_registrada) {
            // Ya habia marcado ingreso hoy: no se pinta la pantalla de verde
            // de nuevo, solo un aviso breve en la barra inferior.
            actualizarGuia(0, `${nombre}, tu ingreso ya estaba registrado`);
            window.setTimeout(() => actualizarGuia(0, "Listo para el siguiente alumno"), 2000);
        } else {
            mostrarResultado(`Bienvenido, ${nombre}`, "ok", 3000);
        }
        const texto = datos.ya_registrada ? `${nombre}, tu ingreso ya estaba registrado.` : `Bienvenido, ${nombre}`;
        enviar({ tipo: "asistencia_resultado", ok: true, mensaje: texto, cliente_id: clienteId, nombre });
    } catch (error) {
        const texto = `${nombre}: ${error.message || "No se pudo autorizar el ingreso"}`;
        mostrarResultado(texto, "aviso", 4000);
        enviar({ tipo: "asistencia_resultado", ok: false, mensaje: texto, cliente_id: clienteId, nombre });
    }
}

async function procesarRegistro(cara) {
    if (Date.now() - ultimaCaptura < 250) return;
    capturas.push(Array.from(cara.embedding));
    const progreso = Math.round((capturas.length / CAPTURAS_REGISTRO) * 100);
    actualizarGuia(
        progreso,
        capturas.length < CAPTURAS_REGISTRO ? `Capturando rostro ${capturas.length} de ${CAPTURAS_REGISTRO}` : "Rostro capturado correctamente",
        progreso === 100 ? "completo" : "capturando",
    );
    ultimaCaptura = Date.now();
    if (capturas.length < CAPTURAS_REGISTRO) return;
    const clienteId = objetivoClienteId, nombre = objetivoNombre;
    try {
        const respuesta = await fetch(`${API_BASE}/dispositivo-facial/biometria/${clienteId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-Camera-Token": token },
            body: JSON.stringify({ descriptor: promedio(capturas), consentimiento: true, version_modelo: MODELO_VERSION }),
        });
        const datos = await respuesta.json().catch(() => ({}));
        if (!respuesta.ok) throw new Error(datos.detail || "No se pudo guardar el registro facial");
        mostrarResultado(`Rostro registrado: ${nombre}`, "ok");
        enviar({ tipo: "registro_completo", cliente_id: clienteId, mensaje: "Rostro registrado correctamente" });
        await cargarDescriptores().catch(() => {});
    } catch (error) {
        mostrarResultado(error.message || "No se pudo guardar el registro facial", "aviso", 4000);
        enviar({ tipo: "registro_error", cliente_id: clienteId, mensaje: error.message || "No se pudo guardar el registro facial" });
    }
    volverAReconocer();
}

async function ciclo() {
    if (!stream || ejecutando) return;
    ejecutando = true;
    try {
        const deteccion = await human.detect(video);
        const validacion = validarRostro(deteccion);
        if (!validacion.cara) actualizarGuia(0, validacion.mensaje, "buscando");
        else if (modo === "registrar") await procesarRegistro(validacion.cara);
        else await procesarReconocimiento(validacion.cara);
    } catch (_) {
        // Se reintenta en el siguiente ciclo; un error puntual de un frame no debe detener la estacion.
    } finally {
        ejecutando = false;
        if (stream) temporizador = window.setTimeout(ciclo, INTERVALO_MS);
    }
}

async function conectar() {
    if (!token) { mensaje.textContent = "Enlace inválido o vencido"; return; }
    boton.style.display = "none";
    estadoNodo.style.display = "block";
    mensaje.textContent = "Preparando reconocimiento facial…";
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: "user" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        });
        video.srcObject = stream;
        await video.play();
        conectarSocket();
        await Promise.all([cargarMotor(), cargarDescriptores()]);
        actualizarGuia(0, "Acomoda tu rostro dentro del óvalo");
        ciclo();
    } catch (error) {
        boton.style.display = "block";
        guia.style.display = "none";
        if (temporizador) window.clearTimeout(temporizador);
        if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
        mensaje.textContent = error.name === "NotAllowedError"
            ? "Debes permitir el uso de la cámara frontal"
            : (error.message || "No se pudo iniciar la cámara");
    }
}
boton.addEventListener("click", conectar);
})();
</script>
</body>
</html>
